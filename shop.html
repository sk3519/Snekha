<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shop All — Mithila Farms</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,700;1,600&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌾</text></svg>" />
</head>
<body>

<div id="siteHeader"></div>

<section class="page-hero">
  <div class="container">
    <span class="eyebrow">The whole pantry</span>
    <h1>Shop all products</h1>
    <p>Roast-crafted flavoured makhana, pond-fresh natural makhana, honest nuts and stone-ground spices — all sourced with a fair-price promise to our farmers.</p>
  </div>
</section>

<div class="container shop-layout">
  <aside class="filters" id="filters">
    <h4>Category</h4>
    <label class="filter-opt"><input type="radio" name="cat" value="all" checked />All Products<span class="cnt" data-cnt="all"></span></label>
    <label class="filter-opt"><input type="radio" name="cat" value="flavoured" />Flavoured Makhana<span class="cnt" data-cnt="flavoured"></span></label>
    <label class="filter-opt"><input type="radio" name="cat" value="natural" />Natural Makhana<span class="cnt" data-cnt="natural"></span></label>
    <label class="filter-opt"><input type="radio" name="cat" value="nuts" />Nuts<span class="cnt" data-cnt="nuts"></span></label>
    <label class="filter-opt"><input type="radio" name="cat" value="spices" />Spices<span class="cnt" data-cnt="spices"></span></label>
    <h4>Price</h4>
    <label class="filter-opt"><input type="radio" name="price" value="any" checked />Any price</label>
    <label class="filter-opt"><input type="radio" name="price" value="lt200" />Under ₹200</label>
    <label class="filter-opt"><input type="radio" name="price" value="200to350" />₹200 – ₹350</label>
    <label class="filter-opt"><input type="radio" name="price" value="gt350" />Above ₹350</label>
    <h4>Diet</h4>
    <label class="filter-opt"><input type="checkbox" id="vegOnly" checked />100% Vegetarian</label>
  </aside>

  <main>
    <div class="shop-toolbar">
      <span class="result-count" id="resultCount"></span>
      <select id="sortSelect" class="sort-select" aria-label="Sort by">
        <option value="featured">Sort: Featured</option>
        <option value="priceAsc">Price, low to high</option>
        <option value="priceDesc">Price, high to low</option>
        <option value="rating">Top rated</option>
        <option value="discount">Biggest discount</option>
      </select>
    </div>
    <div class="grid-products" id="shopGrid" style="grid-template-columns:repeat(auto-fill,minmax(230px,1fr))"></div>
    <div class="no-results" id="noResults" hidden>
      <div style="font-size:2.6rem;margin-bottom:.6rem">🫙</div>
      <p>No products match those filters yet.</p>
      <button class="btn btn-outline" id="clearFilters" style="margin-top:1rem">Clear filters</button>
    </div>
  </main>
</div>

<div id="siteFooter"></div>

<script src="js/data.js"></script>
<script src="js/layout.js"></script>
<script src="js/main.js"></script>
<script src="js/shop.js"></script>
<script src="js/cart-ui.js"></script>
</body>
</html>
