<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Product — Mithila Farms</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,700;1,600&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌾</text></svg>" />
</head>
<body>

<div id="siteHeader"></div>

<main class="container detail-layout" id="detailRoot">
  <p style="grid-column:1/-1;text-align:center;padding:4rem 0;color:var(--muted)">Loading product…</p>
</main>

<section class="product-section" style="padding-top:0">
  <div class="container">
    <h2 class="section-title" style="margin-bottom:1.4rem">You may also like</h2>
    <div class="grid-products" id="relatedGrid"></div>
  </div>
</section>

<div id="siteFooter"></div>

<script src="js/data.js"></script>
<script src="js/layout.js"></script>
<script src="js/main.js"></script>
<script src="js/cart-ui.js"></script>
<script src="js/product-detail.js"></script>
</body>
</html>
